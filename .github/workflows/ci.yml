name: Checks

# Runs on pull requests (including Dependabot's) and is reused by the deploy workflow,
# so a failing check also stops the daily deploy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Colour contrast
        run: npm run contrast

      - name: Scraper tests (offline, saved samples)
        run: npm test

      - name: Build pages (offline)
        run: npm run build:pages
