name: Deploy Mecsekalja Apartman to GitHub Pages

on:
  # Runs automatically on every push to the main branch
  push:
    branches:
      - main
  # Allows manual triggering from the Actions tab in GitHub
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site (excludes original photos and dev files)
        run: |
          mkdir -p _site/img
          cp -r hu en de _site/
          cp index.html style.css app.js events.js events-labels.js lang-redirect.js 404.html favicon.svg sitemap.xml robots.txt _site/
          cp -r img/gallery img/tv_tower.svg img/og-cover.jpg _site/img/

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
