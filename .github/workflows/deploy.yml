name: Deploy Mecsekalja Apartman to GitHub Pages

on:
  # Runs automatically on every push to the main branch
  push:
    branches:
      - main
  # Daily rebuild so the Programs section shows fresh events (04:15 UTC ≈ 05:15/06:15 in Pécs)
  schedule:
    - cron: '15 4 * * *'
  # Allows manual triggering from the Actions tab in GitHub
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      # Last good scrape per source; used when a source is down or changed its markup.
      # Each run saves a new entry; the newest one is restored on the next run.
      - name: Restore event scrape cache
        uses: actions/cache@v4
        with:
          path: src/data/events-cache.json
          key: events-cache-${{ github.run_id }}
          restore-keys: events-cache-

      - name: Scrape events and build pages
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site (excludes original photos and dev files)
        run: |
          mkdir -p _site/img
          cp -r hu en de _site/
          cp index.html style.css app.js events-data.js events.js events-labels.js lang-redirect.js 404.html favicon.svg sitemap.xml robots.txt _site/
          cp -r img/gallery img/tv_tower.svg img/og-cover.jpg _site/img/

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping Healthchecks.io (success)
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "$HEALTHCHECKS_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL"; fi

      - name: Ping Healthchecks.io (failure)
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "$HEALTHCHECKS_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL/fail"; fi
