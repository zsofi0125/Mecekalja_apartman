name: Deploy Mecsekalja Apartman to GitHub Pages

on:
  # Runs automatically on every push to the main branch
  push:
    branches:
      - main
  # Daily rebuild so the Programs section shows fresh events (04:15 UTC ≈ 05:15/06:15 in Pécs)
  schedule:
    - cron: '15 4 * * *'
  # Allows manual triggering from the Actions tab in GitHub
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# (issues: write lets the scraper open and close its alert issue)
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Type check, contrast check, scraper tests and an offline build; a failure here blocks the deploy.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      # Last good scrape per source; used when a source is down or changed its markup.
      # Each run saves a new entry; the newest one is restored on the next run.
      - name: Restore event scrape cache
        uses: actions/cache@v4
        with:
          path: src/data/events-cache.json
          key: events-cache-${{ github.run_id }}
          restore-keys: events-cache-

      # Exits with an error only when
      # the result as a whole looks broken, e.g. most sources failing or the event total collapsing.
      # continue-on-error: the committed events-data.js (last good scrape) is then published as is.
      - name: Scrape events
        id: scrape
        continue-on-error: true
        run: npm run scrape

      # Opens, refreshes or closes the "Event scraper needs attention" issue from scrape-report.json.
      # Must never block the deploy itself.
      - name: Update scraper alert issue
        if: always() && steps.scrape.conclusion != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/events/sync-alert-issue.mjs

      - name: Build pages
        run: npm run build:pages

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Full site, relative links only, so it works at *.github.io/<repo>/ as well as at a domain root.
      # maintenance.html is Cloudflare-only and is deliberately not published here.
      - name: Assemble public site (excludes original photos and dev files)
        run: |
          mkdir -p _site/img/icons _site/houserules
          cp -r hu en de _site/
          cp index.html style.css app.js events-data.js events.js events-labels.js lang-redirect.js 404.html favicon-32.png favicon-48.png favicon-192.png apple-touch-icon.png sitemap.xml robots.txt _site/
          cp -r img/gallery _site/img/
          cp img/tv_tower.svg img/og-cover.jpg _site/img/
          cp img/icons/*.webp _site/img/icons/
          cp houserules/*.pdf _site/houserules/

      # A re-run keeps the previous attempt's artifacts under the same run id, and deploy-pages
      # refuses to pick between two "github-pages" artifacts. Remove stale ones before uploading.
      - name: Remove stale Pages artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            echo "Deleting stale artifact $artifact_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping Healthchecks.io (success)
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "$HEALTHCHECKS_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL"; fi

      - name: Ping Healthchecks.io (failure)
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "$HEALTHCHECKS_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL/fail"; fi
